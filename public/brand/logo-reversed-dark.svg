  <text x="200" y="158" font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">CARD</text>
  <text x="200" y="228" font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">MAX</text>
  <line x1="60" y1="238" x2="340" y2="238" stroke="#444441" stroke-width="0.8"/>
  <text x="200" y="258" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#888780" text-anchor="middle" letter-spacing="3.5">FIND THE BEST CARD DEALS</text>
