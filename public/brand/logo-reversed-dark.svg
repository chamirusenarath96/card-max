<svg width="400" height="280" viewBox="0 0 400 280" xmlns="http://www.w3.org/2000/svg">
  <title>Card Max — Reversed Dark Background</title>
  <rect x="0" y="0" width="400" height="280" rx="12" fill="#0A0A09"/>
  <!-- Card fan -->
  <g transform="translate(174, 22) rotate(-10)" opacity="0.25">
    <rect x="0" y="0" width="52" height="34" rx="4" fill="#FFFFFF"/>
  </g>
  <g transform="translate(174, 22) rotate(-2)" opacity="0.55">
