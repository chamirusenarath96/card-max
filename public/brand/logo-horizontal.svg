<svg width="560" height="100" viewBox="0 0 560 100" xmlns="http://www.w3.org/2000/svg">
  <title>Card Max — Horizontal Logo</title>
  <!-- Card fan icon -->
  <g transform="translate(20, 50) rotate(-10)" opacity="0.3">
    <rect x="0" y="-20" width="46" height="30" rx="4" fill="#0A0A09"/>
  </g>
  <g transform="translate(20, 50) rotate(-3)" opacity="0.6">
    <rect x="0" y="-20" width="46" height="30" rx="4" fill="#0A0A09"/>
  </g>
  <g transform="translate(20, 50) rotate(6)">
    <rect x="0" y="-20" width="46" height="30" rx="4" fill="#0A0A09"/>
    <rect x="4" y="-16" width="9" height="7" rx="1.5" fill="#FFFFFF" opacity="0.55"/>
    <rect x="0" y="-5" width="46" height="6" fill="#FFFFFF" opacity="0.12"/>
  </g>
  <!-- Vertical rule -->
  <line x1="84" y1="18" x2="84" y2="82" stroke="#0A0A09" stroke-width="0.8"/>
  <!-- Wordmark -->
  <text x="100" y="62" font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif" font-size="46" font-weight="900" fill="#0A0A09" letter-spacing="-1">CARD MAX</text>
  <!-- Slogan -->
  <text x="100" y="82" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" letter-spacing="3.5">FIND THE BEST CARD DEALS</text>
</svg>
