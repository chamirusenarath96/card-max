name: CI Dashboard

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["CI / Deploy"]
    types: [completed]

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dashboard:
    name: Build & Publish Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # required for gh-pages push
      actions: read     # required for workflow runs API (spec 028)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Step 1: Vitest with Allure output ────────────────────────────────────
      # allure-vitest reporter + resultsDir are configured in vitest.config.ts
      # (active only when CI=true). The ALLURE_RESULTS_DIR env var is NOT
      # honoured by allure-vitest — resultsDir must be set in config.
      - name: Run unit tests with Allure reporter
        run: npm run test

      # ── Step 2: Playwright E2E with Allure reporter ───────────────────────────
      - name: Build for E2E
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # allure-playwright reporter + outputFolder are configured in playwright.config.ts
      # (active only when CI=true). No --reporter CLI flag needed — config handles it.
      - name: Run E2E tests with Allure reporter
        run: npx playwright test
        if: always()
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      # ── Step 3: Generate Allure HTML reports ──────────────────────────────────
      - name: Generate Allure unit report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate allure-results/unit --output dashboard/allure-unit --clean

      - name: Generate Allure E2E report
        if: always()
        run: allure generate allure-results/e2e --output dashboard/allure-e2e --clean

      # ── Step 4: Download latest LHCI artefact ─────────────────────────────────
      - name: Download Lighthouse report artefact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          name: lighthouse-report-*
          path: dashboard/lighthouse
          search_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      # ── Step 4b: Download latest Lighthouse user-flow artefact (spec 029) ──────
      - name: Download Lighthouse user-flow artefact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          name: lhci-user-flow-*
          path: dashboard/lighthouse-user-flow
          search_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      # ── Step 5: Fetch cron job run summaries ─────────────────────────────────
      - name: Fetch cron job run summaries
        if: always()
        run: node scripts/fetch-cron-summary.js
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # ── Step 6: Generate index.html ───────────────────────────────────────────
      - name: Generate dashboard index
        if: always()
        run: node scripts/build-dashboard-index.js

      # ── Step 7: Publish to gh-pages ───────────────────────────────────────────
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          keep_files: false
