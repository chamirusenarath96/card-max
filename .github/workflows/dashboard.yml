name: CI Dashboard

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["CI / Deploy"]
    types: [completed]

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dashboard:
    name: Build & Publish Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # required for gh-pages push
      actions: read     # required for workflow runs API (spec 028)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Step 1: Vitest → Allure unit report ──────────────────────────────────
      # allure-vitest/reporter CLI flag does not write results reliably in this
      # project (confirmed across 3 CI runs — allure-results/ is never created).
      # Use Vitest's built-in JUnit reporter instead: allure-commandline natively
      # reads JUnit XML and generates a full Allure report from it.
      - name: Run unit tests with JUnit reporter
        run: npm run test -- --reporter=junit --outputFile=allure-results/junit.xml

      - name: Install allure-commandline
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure unit report
        if: always()
        run: |
          allure generate allure-results --output dashboard/allure-unit --clean
          rm -rf allure-results

      # ── Step 2: Playwright E2E → Allure E2E report ───────────────────────────
      - name: Build for E2E
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts adds allure-playwright reporter when CI=true.
      # allure-playwright writes to allure-results/ (its default dir).
      # allure-results/ was cleared above so unit and e2e results don't mix.
      - name: Run E2E tests with Allure reporter
        run: npx playwright test
        if: always()
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Generate Allure E2E report
        if: always()
        run: allure generate allure-results --output dashboard/allure-e2e --clean

      # ── Step 4: Download latest LHCI artefact ─────────────────────────────────
      # When triggered by workflow_run (CI / Deploy completed), use the exact
      # run_id so we don't rely on glob search which fails to match.
      # When triggered by push, fall back to search_artifacts across ci.yml runs.
      - name: Download Lighthouse report artefact (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: lighthouse-report-*
          name_is_regexp: true
          path: dashboard/lighthouse
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Download Lighthouse report artefact (push fallback)
        if: github.event_name == 'push'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          name: lighthouse-report-*
          name_is_regexp: true
          path: dashboard/lighthouse
          search_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      # ── Step 4b: Download latest Lighthouse user-flow artefact (spec 029) ──────
      - name: Download Lighthouse user-flow artefact (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: lhci-user-flow-*
          name_is_regexp: true
          path: dashboard/lighthouse-user-flow
          if_no_artifact_found: warn
        continue-on-error: true

      - name: Download Lighthouse user-flow artefact (push fallback)
        if: github.event_name == 'push'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ci.yml
          name: lhci-user-flow-*
          name_is_regexp: true
          path: dashboard/lighthouse-user-flow
          search_artifacts: true
          if_no_artifact_found: warn
        continue-on-error: true

      # ── Step 4c: Normalize Lighthouse artefact directories ───────────────────
      # dawidd6/action-download-artifact extracts into a SHA-named subdirectory.
      # Flatten both directories so that:
      #   dashboard/lighthouse/lhr-run1.report.html  (link: ./lighthouse/)
      #   dashboard/lighthouse-user-flow/report.html (link: ./lighthouse-user-flow/report.html)
      # are served correctly by GitHub Pages.
      - name: Normalize Lighthouse artefact paths
        if: always()
        run: |
          # ── Lighthouse CI ────────────────────────────────────────────────────
          if [ -d "dashboard/lighthouse" ]; then
            # Move all files out of any SHA subdirectory
            find dashboard/lighthouse -mindepth 2 -type f \
              -exec mv -n {} dashboard/lighthouse/ \; 2>/dev/null || true
            # Remove now-empty subdirectories
            find dashboard/lighthouse -mindepth 1 -maxdepth 1 -type d \
              -exec rm -rf {} + 2>/dev/null || true
            # Create index.html that redirects to the run-1 HTML report so
            # ./lighthouse/ works as a clickable link on GitHub Pages.
            echo '<!doctype html><meta http-equiv="refresh" content="0;url=lhr-run1.report.html"><a href="lhr-run1.report.html">Lighthouse Report (run 1)</a>' \
              > dashboard/lighthouse/index.html
            echo "lighthouse/ contents:"
            ls -lh dashboard/lighthouse/
          fi

          # ── Lighthouse User Flow ─────────────────────────────────────────────
          if [ -d "dashboard/lighthouse-user-flow" ]; then
            # Move report.html from any SHA subdirectory up to the parent
            find dashboard/lighthouse-user-flow -mindepth 2 -name "report.html" \
              -exec mv -n {} dashboard/lighthouse-user-flow/ \; 2>/dev/null || true
            # Remove now-empty subdirectories
            find dashboard/lighthouse-user-flow -mindepth 1 -maxdepth 1 -type d \
              -exec rm -rf {} + 2>/dev/null || true
            echo "lighthouse-user-flow/ contents:"
            ls -lh dashboard/lighthouse-user-flow/
          fi
        continue-on-error: true

      # ── Step 5: Fetch cron job run summaries ─────────────────────────────────
      - name: Fetch cron job run summaries
        if: always()
        run: node scripts/fetch-cron-summary.js
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # ── Step 6: Generate index.html ───────────────────────────────────────────
      - name: Generate dashboard index
        if: always()
        run: node scripts/build-dashboard-index.js

      # ── Step 7: Publish to gh-pages ───────────────────────────────────────────
      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard
          keep_files: false
