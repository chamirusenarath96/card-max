name: CI / Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 0: Security audit (runs in parallel with ci) ─────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      security-events: write   # required for SARIF upload to Code Scanning
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: npm audit (High+Critical)
        run: npm audit --audit-level=high

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: ".trivyignore"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

  # ── Job 1: Lint, type-check, unit tests, build ────────────────────────────────
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Validate workflow YAML files
        run: |
          for f in .github/workflows/*.yml .github/actions/setup/action.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "$f: valid"
          done

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit & Component tests
        run: npm run test

      - name: Build
        run: npm run build

  # ── Job 2: Playwright E2E (runs after Job 1 passes) ───────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ci
    environment: Production

    permissions:
      contents: write   # required to commit initial visual regression baselines

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build (for E2E server)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate missing visual regression baselines
        run: |
          npx playwright test e2e/visual.spec.ts \
            --project=chromium \
            --update-snapshots=missing \
            --reporter=list 2>&1 || true
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Commit generated baselines to branch (first-run only)
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add e2e/snapshots/ 2>/dev/null || true
          git diff --cached --quiet || (
            git commit -m "test: generate initial visual regression baselines [skip ci]" &&
            git push origin HEAD:${{ github.head_ref || github.ref_name }} || true
          )
        continue-on-error: true

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Upload visual diff artefacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs-${{ github.sha }}
          path: e2e/snapshots/
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Job 3: Run DB migrations (push to master only, after CI + E2E pass) ─────────
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    if: github.event_name == 'push'
    environment: Production

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run migrations
        run: npm run migrate
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Notify on migration failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Migrate] DB migration failed - ${new Date().toISOString().split('T')[0]}`,
              body: [
                '## DB Migration Failed',
                '',
                `**Commit:** \`${context.sha.slice(0,7)}\``,
                `**Workflow:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'The deploy job has been blocked. Fix the failing migration before merging.',
              ].join('\n'),
              labels: ['bug', 'deploy'],
            });

  # ── Job 4: Deploy to Vercel (push to master only, after CI + E2E + migrate pass) ─
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ci, e2e, migrate]
    if: github.event_name == 'push'

    environment:
      name: production
      url: https://card-max.vercel.app

    permissions:
      contents: write  # post commit comment
      issues: write    # create failure issue

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment & config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Install Lighthouse for user-flow audit
        run: npm install --no-save lighthouse@^12 puppeteer-core

      - name: Install Playwright browsers (for user-flow audit)
        run: npx playwright install --with-deps chromium

      - name: Promote to production
        run: |
          vercel promote ${{ steps.deploy.outputs.preview_url }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --yes \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Production Lighthouse CI — always runs after promote, no bypass
      # token needed. Uses the raw `lighthouse` CLI which writes plain JSON
      # LHR files directly to disk (lhci collect uses SQLite and lhci assert
      # wipes the outputDir on init, both causing upload-artifact to find nothing).
      # Three separate steps: collect → upload → assert, so artifact capture
      # happens before lhci assert can initialise its storage over .lighthouseci/.
      # Use a plain directory name (not .lighthouseci) so lhci cannot
      # interfere with it. The .lighthouseci name is special to lhci and
      # causes upload-artifact to find nothing despite files being present.
      - name: Collect Lighthouse reports (production)
        run: |
          npm install -g lighthouse
          mkdir -p lighthouse-reports
          for i in 1 2 3; do
            # --output=json,html writes lhr-runN.report.json + lhr-runN.report.html
            lighthouse https://card-max.vercel.app \
              --output=json --output=html \
              --output-path="$GITHUB_WORKSPACE/lighthouse-reports/lhr-run${i}" \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --quiet || true
          done
          echo "=== lighthouse-reports/ contents ==="
          ls -lh "$GITHUB_WORKSPACE/lighthouse-reports/"
        timeout-minutes: 8
        continue-on-error: true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.sha }}
          path: lighthouse-reports/
          retention-days: 14

      - name: Assert Lighthouse SLA thresholds (production)
        if: always()
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci assert --inputDir=lighthouse-reports || echo "⚠️  Lighthouse assertion failed — see results above"
        continue-on-error: true

      - name: Invalidate ISR cache
        run: |
          STATUS=$(curl -s -o /tmp/revalidate.txt -w "%{http_code}" \
            --max-time 15 -X POST \
            -H "Authorization: Bearer ${{ secrets.VERCEL_REVALIDATION_SECRET }}" \
            https://card-max.vercel.app/api/revalidate)
          echo "Revalidate status: $STATUS"
          cat /tmp/revalidate.txt
          if [ "$STATUS" != "200" ]; then
            echo "⚠️  Cache invalidation returned $STATUS — site will refresh within 1 hour"
          fi
        continue-on-error: true

      - name: Comment deploy URL on commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 **Deployed to production**\n\nhttps://card-max.vercel.app\n\nCommit: \`${context.sha.slice(0, 7)}\``,
            });

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Deploy] Production deploy failed - ${new Date().toISOString().split('T')[0]}`,
              body: [
                '## Production Deploy Failed',
                '',
                `**Commit:** \`${context.sha.slice(0,7)}\``,
                `**Workflow:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Please investigate and redeploy.',
              ].join('\n'),
              labels: ['bug', 'deploy'],
            });
