name: CI / Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 0: Security audit (runs in parallel with ci) ─────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      security-events: write   # required for SARIF upload to Code Scanning
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: npm audit (High+Critical)
        run: npm audit --audit-level=high

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: ".trivyignore"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy"

  # ── Job 1: Lint, type-check, unit tests, build ────────────────────────────────
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Validate workflow YAML files
        run: |
          for f in .github/workflows/*.yml .github/actions/setup/action.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" && echo "$f: valid"
          done

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit & Component tests
        run: npm run test

      - name: Build
        run: npm run build

  # ── Job 2: Playwright E2E (runs after Job 1 passes) ───────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: ci
    environment: Production

    permissions:
      contents: write   # required to commit initial visual regression baselines

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build (for E2E server)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate missing visual regression baselines
        run: |
          npx playwright test e2e/visual.spec.ts \
            --project=chromium \
            --update-snapshots=missing \
            --reporter=list 2>&1 || true
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Commit generated baselines to branch (first-run only)
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add e2e/snapshots/ 2>/dev/null || true
          git diff --cached --quiet || (
            git commit -m "test: generate initial visual regression baselines [skip ci]" &&
            git push origin HEAD:${{ github.head_ref || github.ref_name }} || true
          )
        continue-on-error: true

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Upload visual diff artefacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs-${{ github.sha }}
          path: e2e/snapshots/
          retention-days: 7

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Job 3: Run DB migrations (push to master only, after CI + E2E pass) ─────────
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    if: github.event_name == 'push'
    environment: Production

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Run migrations
        run: npm run migrate
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Notify on migration failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Migrate] DB migration failed - ${new Date().toISOString().split('T')[0]}`,
              body: [
                '## DB Migration Failed',
                '',
                `**Commit:** \`${context.sha.slice(0,7)}\``,
                `**Workflow:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'The deploy job has been blocked. Fix the failing migration before merging.',
              ].join('\n'),
              labels: ['bug', 'deploy'],
            });

  # ── Job 4: Deploy to Vercel (push to master only, after CI + E2E + migrate pass) ─
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ci, e2e, migrate]
    if: github.event_name == 'push'

    environment:
      name: production
      url: https://card-max.vercel.app

    permissions:
      contents: write  # post commit comment
      issues: write    # create failure issue

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment & config
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run Lighthouse CI
        run: |
          if [ -z "$VERCEL_BYPASS_TOKEN" ]; then
            echo "VERCEL_BYPASS_TOKEN not set — skipping Lighthouse CI (cannot reach protected preview deployment)"
            echo "To enable: Vercel dashboard → Project → Settings → Deployment Protection → Protection Bypass for Automation"
            echo "Then add the token as VERCEL_BYPASS_TOKEN in GitHub → Settings → Secrets → Actions."
            exit 0
          fi
          npm install -g @lhci/cli@0.14.x
          # Explicit collect writes LHR JSON to disk before upload/assert
          lhci collect \
            --url="${{ steps.deploy.outputs.preview_url }}" \
            --settings.extraHeaders='{"x-vercel-protection-bypass":"${{ secrets.VERCEL_BYPASS_TOKEN }}"}' \
            --numberOfRuns=3 \
            --outputDir=.lighthouseci/preview
          lhci upload \
            --target=temporary-public-storage \
            --inputDir=.lighthouseci/preview || true
          lhci assert \
            --inputDir=.lighthouseci/preview || echo "⚠️  Lighthouse assertion failed — see results above"
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
        timeout-minutes: 10
        continue-on-error: true

      # Preview Lighthouse only runs when VERCEL_BYPASS_TOKEN is set.
      # Uploaded under a different name so the production upload below can
      # always claim the canonical "lighthouse-report-*" name.
      - name: Upload Lighthouse preview report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-preview-report-${{ github.sha }}
          path: .lighthouseci/preview/
          retention-days: 14

      # User-flow deps installed regardless — used for both preview and
      # production runs below.
      - name: Install Lighthouse for user-flow audit
        run: npm install --no-save lighthouse@^12

      - name: Install Playwright browsers (for user-flow audit)
        run: npx playwright install --with-deps chromium

      # Preview user-flow: exits 0 gracefully when VERCEL_BYPASS_TOKEN is
      # absent (protected preview URL cannot be reached without it).
      - name: Run Lighthouse user-flow audit (preview)
        run: |
          node scripts/lhci-user-flow.js
        env:
          TARGET_URL: ${{ steps.deploy.outputs.preview_url }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
        timeout-minutes: 10

      - name: Promote to production
        run: |
          vercel promote ${{ steps.deploy.outputs.preview_url }} \
            --scope=${{ secrets.VERCEL_ORG_ID }} \
            --yes \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Production Lighthouse CI — always runs after promote, no bypass
      # token needed. Uploaded as "lighthouse-report-*" so the dashboard
      # workflow can find it with its existing download pattern.
      # Split into explicit collect → upload → assert so that LHR JSON files
      # are guaranteed on disk before the artifact upload step runs.
      - name: Run Lighthouse CI (production)
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci collect \
            --url="https://card-max.vercel.app" \
            --numberOfRuns=3 \
            --outputDir=.lighthouseci
          lhci upload \
            --target=temporary-public-storage \
            --inputDir=.lighthouseci || true
          lhci assert \
            --inputDir=.lighthouseci || echo "⚠️  Lighthouse assertion failed — see results above"
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.sha }}
          path: .lighthouseci/
          retention-days: 14

      # Production user-flow — runs against card-max.vercel.app after
      # promote. No bypass token needed. Always produces report data.
      - name: Run Lighthouse user-flow audit (production)
        run: node scripts/lhci-user-flow.js
        env:
          TARGET_URL: https://card-max.vercel.app
        timeout-minutes: 10
        continue-on-error: true

      - name: Upload Lighthouse user-flow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-user-flow-${{ github.sha }}
          path: .lighthouseci/user-flow/
          retention-days: 14

      - name: Invalidate ISR cache
        run: |
          STATUS=$(curl -s -o /tmp/revalidate.txt -w "%{http_code}" \
            --max-time 15 -X POST \
            -H "Authorization: Bearer ${{ secrets.VERCEL_REVALIDATION_SECRET }}" \
            https://card-max.vercel.app/api/revalidate)
          echo "Revalidate status: $STATUS"
          cat /tmp/revalidate.txt
          if [ "$STATUS" != "200" ]; then
            echo "⚠️  Cache invalidation returned $STATUS — site will refresh within 1 hour"
          fi
        continue-on-error: true

      - name: Comment deploy URL on commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 **Deployed to production**\n\nhttps://card-max.vercel.app\n\nCommit: \`${context.sha.slice(0, 7)}\``,
            });

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Deploy] Production deploy failed - ${new Date().toISOString().split('T')[0]}`,
              body: [
                '## Production Deploy Failed',
                '',
                `**Commit:** \`${context.sha.slice(0,7)}\``,
                `**Workflow:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Please investigate and redeploy.',
              ].join('\n'),
              labels: ['bug', 'deploy'],
            });
