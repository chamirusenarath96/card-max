name: Offer Enrichment

on:
  # Runs after the Daily Crawler workflow completes — decoupled from the
  # crawl itself (spec 044, Architecture Decision #1). It only processes
  # offers left `enrichmentStatus: "pending"`/`"failed"` by the crawler's
  # upsert step, never a full sweep of the collection.
  workflow_run:
    workflows: ["Daily Crawler"]
    types:
      - completed

  # Manual trigger from GitHub Actions UI (useful for retrying/backfilling)
  workflow_dispatch:

permissions:
  issues: write  # required so the "Notify on failure" step can open an issue (#98)

jobs:
  enrich:
    name: Enrich Pending/Failed Offers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production  # grants access to MONGODB_URI and GEMINI_API_KEY secrets

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run enrichment
        id: enrich
        run: npm run enrich
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Notify on failure (open GitHub Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Enrichment] Offer enrichment run failed — ${today}`,
              body: [
                '## Enrichment Failure',
                '',
                `**Date:** ${today}`,
                `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '### Checklist',
                '- [ ] Check MONGODB_URI / GEMINI_API_KEY secrets are still valid',
                '- [ ] Check MongoDB Atlas connectivity',
                '- [ ] Check Gemini API status',
                '- [ ] Re-run workflow manually once fixed — pending/failed offers are retried automatically',
              ].join('\n'),
              labels: ['bug', 'urgent', 'enrichment']
            });
